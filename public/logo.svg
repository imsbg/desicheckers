<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dcBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="redPiece" x1="36" y1="10" x2="54" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="55%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="ivoryPiece" x1="10" y1="36" x2="28" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded App Icon Frame -->
  <rect width="64" height="64" rx="16" fill="url(#dcBg)" />

  <!-- 2x2 Checkers Board Squares -->
  <rect x="6" y="6" width="26" height="26" rx="5" fill="#FEF3C7" />
  <rect x="32" y="6" width="26" height="26" rx="5" fill="#115E59" />
  <rect x="6" y="32" width="26" height="26" rx="5" fill="#115E59" />
  <rect x="32" y="32" width="26" height="26" rx="5" fill="#FEF3C7" />

  <!-- Top-Right Crimson Checker Piece -->
  <circle cx="45" cy="19" r="9.5" fill="url(#redPiece)" stroke="#FFF1F2" stroke-width="2" />
  <circle cx="45" cy="19" r="5.5" stroke="#FDA4AF" stroke-opacity="0.65" stroke-width="1.2" />

  <!-- Bottom-Left Ivory Checker Piece -->
  <circle cx="19" cy="45" r="9.5" fill="url(#ivoryPiece)" stroke="#334155" stroke-width="2" />
  <circle cx="19" cy="45" r="5.5" stroke="#64748B" stroke-opacity="0.5" stroke-width="1.2" />
</svg>
